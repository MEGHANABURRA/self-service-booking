spring.application.name=self-service-booking

# PostgreSQL datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/self_service_booking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}

# Google Calendar (OAuth client JSON). On the first start the browser opens for Google sign-in;
# events are created on the calendar of the account that signs in (saikoteshk@gmail.com).
# The resulting refresh token is stored in tokens-dir and reused on later starts.
google.calendar.application-name=self-service-booking
google.calendar.oauth-client-path=${GOOGLE_OAUTH_CLIENT_PATH:${user.home}/Downloads/client_secret_505214380501-fnhaaf66uosa2asgul452nakh1drbj1h.apps.googleusercontent.com.json}
google.calendar.tokens-dir=${GOOGLE_OAUTH_TOKENS_DIR:${user.home}/.self-service-booking/google-tokens}
google.calendar.oauth-callback-port=${GOOGLE_OAUTH_CALLBACK_PORT:8888}
google.calendar.calendar-id=${GOOGLE_CALENDAR_ID:primary}
google.calendar.time-zone=${GOOGLE_CALENDAR_TIME_ZONE:UTC}
google.calendar.event-summary=${GOOGLE_CALENDAR_EVENT_SUMMARY:Interview}
# Google invite/cancellation emails to attendees: all | externalOnly | none
google.calendar.send-updates=${GOOGLE_CALENDAR_SEND_UPDATES:all}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
booking.kafka.email-notification-topic=${EMAIL_NOTIFICATION_TOPIC:emailNotification}

# Booking limits
booking.max-bookings-per-host-per-day=${MAX_BOOKINGS_PER_HOST_PER_DAY:5}
