spring.application.name=self-service-booking

# PostgreSQL datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/self_service_booking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Schema is managed by SQL scripts in src/main/resources/db (see schema.sql)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}

# Booking notification events
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:booking-notifications}
spring.kafka.consumer.auto-offset-reset=${KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
booking.notifications.topic=${BOOKING_NOTIFICATIONS_TOPIC:booking-events}
booking.notifications.from=${BOOKING_NOTIFICATIONS_FROM:no-reply@localhost}

# SMTP email delivery
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:false}

# JWT (base64-encoded HMAC key, min 256 bits). The default is for local dev only - set JWT_SECRET elsewhere.
security.jwt.secret=${JWT_SECRET:SQ1j3tC3Bun+WwpgQsgVo2X4hjdeLMj9KbyGlA6bX8I=}
security.jwt.expiration=${JWT_EXPIRATION:PT1H}
security.refresh-token.expiration=${REFRESH_TOKEN_EXPIRATION:P7D}

# Email OTP for registration. The secret (base64, HMAC key for stored OTPs) default is for local dev only.
security.otp.secret=${OTP_SECRET:kzIQVRLQUCxztBXOC02cGfZO2ZLbp53a3VACpgZITRA=}
security.otp.expiration=${OTP_EXPIRATION:PT10M}
security.otp.resend-cooldown=${OTP_RESEND_COOLDOWN:PT60S}
security.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
security.otp.from=${OTP_EMAIL_FROM:${booking.notifications.from}}
