<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}">
<body>
<p th:text="${greeting}">Hello,</p>
<p th:text="${intro}">Use this code to verify your email address for Self-Service Booking:</p>
<p style="font-size: 24px; font-weight: bold; letter-spacing: 4px;" th:text="${otp}">123456</p>

<p><span th:text="${signoff}">Thanks,</span><br><span th:text="${signature}">Self-Service Booking</span></p>
</body>
</html>
